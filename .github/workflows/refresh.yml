name: Refresh data

# Veriyi (Yahoo + KAP + Google News) tazeler ve data/ klasörünü commit'ler.
# Uygulama bu dosyaları raw.githubusercontent.com ile canlı çeker — hiçbir
# site build'i tetiklenmez, hiçbir hosting limitine takılmaz.

on:
  schedule:
    # Her 10 dk, hafta içi, ~10:00–18:55 TSİ (UTC+3 → 07:00–15:55 UTC).
    # GitHub cron gecikmelerine karşı 10 dk seçildi; public repo = sınırsız Actions.
    - cron: "*/10 7-15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Manuel çalışma kilidi: data/PAUSE dosyası varsa cron bu koşuyu atlar.
      # Böylece yerelde veri üretip commit'lerken bot araya girip çakışma
      # yaratmaz. Elle tetiklemede (workflow_dispatch) kilit YOK SAYILIR.
      - name: Duraklatma kilidi
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ -f data/PAUSE ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "⏸  data/PAUSE var — otomatik koşu atlandı. (Elle tetiklemede yok sayılır.)"
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.paused == 'false'
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
        if: steps.guard.outputs.paused == 'false'
      - run: node refresh-cloud.mjs
        if: steps.guard.outputs.paused == 'false'
        continue-on-error: true
      - name: Commit refreshed data
        if: steps.guard.outputs.paused == 'false'
        run: |
          git config user.name "bist-nabiz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Veri değişmedi — commit yok."
          else
            git commit -m "data: otomatik yenileme ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase --autostash origin main || true
            git push
          fi
