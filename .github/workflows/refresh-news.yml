name: Refresh news (7/24)

# Sadece haberleri tazeler (news.json / marketNews.json / commodityNews.json).
# Fiyat/teknik/temel dosyalara DOKUNMAZ. Amaç: borsa kapalıyken de (hafta sonu
# dahil) taze haber akışı — kullanıcı hafta sonu program kurabilsin.
# Saat kapısı (dakika < 15) fetchMarketNews içinde; bu akış FORCE_NEWS=1 ile onu atlar.

on:
  schedule:
    # 2 saatte bir, :05'te, 06:00–20:00 UTC (≈09:00–23:00 TSİ), HER GÜN (hafta sonu dahil).
    # Saatlikti; özel depoda Actions dakikası sınırlı olduğu için 2026-10-02'de seyreltildi
    # (koşu ~65 sn → 2 dk faturalanıyor). Seans içinde 10 dk'lık akış da saat başı haber çeker.
    - cron: "5 6-20/2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Diğer refresh akışlarıyla aynı grup: aynı anda data/ yazmazlar.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Duraklatma kilidi
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ -f data/PAUSE ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "⏸  data/PAUSE var — otomatik koşu atlandı."
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.guard.outputs.paused == 'false'
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
        if: steps.guard.outputs.paused == 'false'
      - run: node refresh-cloud.mjs --news-only
        if: steps.guard.outputs.paused == 'false'
        continue-on-error: true
        # Bu akışın tek işi haber: saat kapısını (dakika < 15) atla. GitHub zamanlanmış
        # koşuları sık sık 15–60 dk geciktiriyor; 2026-10-03'te 4 koşunun 3'ü kapıya
        # takılıp hiç basın haberi çekmeden bitti.
        env:
          FORCE_NEWS: "1"
      - name: Commit news
        if: steps.guard.outputs.paused == 'false'
        run: |
          git config user.name "bist-nabiz-bot"
          git config user.email "actions@users.noreply.github.com"
          # Everything the news run writes (news, marketNews, commodityNews, kapText…).
          # Listing files by hand broke this step on 2026-10-04: kapText.json was
          # left unstaged and every rebase refused to start.
          git add data
          if git diff --cached --quiet; then
            echo "haber değişmedi — commit yok."
          else
            git commit -m "news: haber tazeleme ($(date -u +%Y-%m-%dT%H:%MZ))"
            for i in $(seq 1 10); do
              git fetch --quiet origin main || { echo "fetch $i basarisiz"; sleep $((RANDOM % 10 + 6)); continue; }
              if git rebase --autostash -X theirs origin/main; then
                if git push origin HEAD:main; then echo "push tamam (deneme $i)"; exit 0; fi
              else
                git rebase --abort 2>/dev/null || true
              fi
              echo "push denemesi $i basarisiz - tekrar deniyor..."; sleep $((RANDOM % 10 + 6))
            done
            echo "push 10 denemede basarisiz oldu"; exit 1
          fi
