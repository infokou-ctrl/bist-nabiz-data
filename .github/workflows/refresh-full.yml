name: Refresh data (full)

# Günde bir kez: normal yenilemeye ek olarak BIST 100 DIŞINDAKİ tüm sembollerin
# 1 yıllık grafik + gösterge + pivot verisini üretir (*Ext.json).
#
# Neden ayrı: 10 dakikalık cron'da ~770 sembol için grafik çekmek hem Yahoo'yu
# zorlar hem de her koşuyu dakikalarca uzatır. Bu iş seans öncesi bir kez koşar;
# uygulama bu dosyaları yalnızca 100 dışı bir hisse açıldığında indirir.

on:
  schedule:
    # 03:40 UTC = 06:40 TSİ — seans açılmadan önce.
    - cron: "40 3 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

# Hızlı yenilemeyle aynı grup: ikisi aynı anda data/ yazmasın.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Duraklatma kilidi
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ -f data/PAUSE ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "⏸  data/PAUSE var — otomatik koşu atlandı."
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.guard.outputs.paused == 'false'
        with:
          node-version: "20"
      - run: npm ci --no-audit --no-fund
        if: steps.guard.outputs.paused == 'false'
      - run: FULL=1 node refresh-cloud.mjs
        if: steps.guard.outputs.paused == 'false'
        continue-on-error: true
      - name: Commit refreshed data
        if: steps.guard.outputs.paused == 'false'
        run: |
          git config user.name "bist-nabiz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Veri değişmedi — commit yok."
          else
            git commit -m "data: tam yenileme ($(date -u +%Y-%m-%dT%H:%MZ))"
            for i in $(seq 1 10); do
              git fetch --quiet origin main || { echo "fetch $i basarisiz"; sleep $((RANDOM % 10 + 6)); continue; }
              if git rebase -X theirs origin/main; then
                if git push origin HEAD:main; then echo "push tamam (deneme $i)"; exit 0; fi
              else
                git rebase --abort 2>/dev/null || true
              fi
              echo "push denemesi $i basarisiz - tekrar deniyor..."; sleep $((RANDOM % 10 + 6))
            done
            echo "push 10 denemede basarisiz oldu"; exit 1
          fi
