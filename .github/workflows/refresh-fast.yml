name: Refresh fast (intraday)

# Sadece intraday.json'u tazeler — tek batched Yahoo quote, ~1-2 dk taze fiyat.
# Ağır 1y chart/temel/haber döngüsüne DOKUNMAZ; yalnızca data/intraday.json yazar.
# Uygulama bunu stocks.json üstüne merge eder (bkz. src/data.ts).

# ZAMANLAMA KAPALI (2026-10-02): depo PRIVATE yapılıyor; özel depoda Actions 2.000 dk/ay
# ile sınırlı ve bu katman tek başına ~26 dk/gün yiyordu. Uygulama, anlık görüntüden
# eski intraday.json'u yok sayar (src/data.ts mergeIntraday). Elle çalıştırma duruyor.
# Geri açmak için: schedule bloğunu geri koy (GitHub Pro = 3.000 dk).
on:
  workflow_dispatch: {}

permissions:
  contents: write

# refresh.yml ile AYNI grup: aynı anda data/ yazmazlar (rebase çakışması olmaz).
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Duraklatma kilidi
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ -f data/PAUSE ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "⏸  data/PAUSE var — otomatik koşu atlandı."
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.guard.outputs.paused == 'false'
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
        if: steps.guard.outputs.paused == 'false'
      - run: node refresh-cloud.mjs --intraday-only
        if: steps.guard.outputs.paused == 'false'
        continue-on-error: true
      - name: Commit intraday
        if: steps.guard.outputs.paused == 'false'
        run: |
          git config user.name "bist-nabiz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/intraday.json
          if git diff --cached --quiet; then
            echo "intraday değişmedi — commit yok."
          else
            git commit -m "intraday: fiyat tazeleme ($(date -u +%Y-%m-%dT%H:%MZ))"
            for i in $(seq 1 10); do
              git fetch --quiet origin main || { echo "fetch $i basarisiz"; sleep $((RANDOM % 10 + 6)); continue; }
              if git rebase --autostash -X theirs origin/main; then
                if git push origin HEAD:main; then echo "push tamam (deneme $i)"; exit 0; fi
              else
                git rebase --abort 2>/dev/null || true
              fi
              echo "push denemesi $i basarisiz - tekrar deniyor..."; sleep $((RANDOM % 10 + 6))
            done
            echo "push 10 denemede basarisiz oldu"; exit 1
          fi
